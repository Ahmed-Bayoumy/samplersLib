[project]
name = "samplerslib"
version = "2026.0"
requires-python = ">=3.10"

description = "A samplers library for (in)active sampling that supports both supports both online and offline interactions with processes executed by external libraries"

authors = [
    { name = "Ahmed H. Bayoumy", email = "ahmed.bayoumy@mail.mcgill.ca" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: BSD License",  # Use this standardized version
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydoe2>=1.3.0",
    "requests>=2.32.5",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.8",
    "plotly>=6.5.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]
